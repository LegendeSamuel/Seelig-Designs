<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>Testimonial — preview</title>
<style>
  html, body { margin: 0; }
  body { padding: 24px; background: var(--surface); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .cap { font-size: 12.8px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-caption); margin: 0 0 var(--space-1); }
</style>
</head>
<body class="sd">
<div style="max-width:800px">
  <div class="testimonial-slide">
    <div class="testimonial-content">
      <p class="quote">Samuels ruhige Präsenz war perfekt für unseren Tag.</p>
      <cite class="author">- Kristina &amp; Reinhard</cite>
    </div>
    <div class="testimonial-image"><img class="profil profil--sm" src="../../../img/testi1.jpg" alt="Kundenfoto"></div>
  </div>
  <div class="slider-navigation" style="margin-top:var(--space-4)">
    <button class="slider-btn" aria-label="Vorheriges Testimonial">&larr;</button>
    <button class="slider-btn" aria-label="Nächstes Testimonial">&rarr;</button>
  </div>
</div>
</body>
</html>
