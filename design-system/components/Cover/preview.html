<!-- @dsCard height=288 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>Seelig Designs</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .yellow { fill: var(--yellow); }
  .gold { fill: var(--gold); }
  .amber { fill: var(--amber); }
  .orange { fill: var(--orange); }
  .rust { fill: var(--rust); }
  .tile { rx: var(--radius-lg); }
  .ring { fill: none; stroke: var(--bg); stroke-width: 3px; }
  .iris { fill: var(--bg); }
  .words { position: absolute; left: var(--space-4); bottom: var(--space-4); max-width: 440px; }
  .name { margin: 0; font-size: 96px; line-height: .95; font-weight: 200; letter-spacing: -.01em; color: var(--text); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; font-weight: 300; color: var(--text-label); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      amber 140×232 (the brand colour, largest) · orange 140×136 · gold 140×164 · rust 160×204 · yellow 140×68 — the five Samus Farben hues, ≈42% of 960×288, on `bg`
        arrangement a three-column masonry like the Highlights grid: unequal tiles at natural heights bleeding off top, bottom and right; gutters gap-masonry (20px)
        pattern     lens rings, from "photography seen through warm amber light" and "people are round": three concentric rings and an iris cut from the amber tile in `bg`, stroke 3px like the portrait ring
        scales      gutters gap-masonry 20; column 140 (tiles) · 160 (bleeding); corners radius-lg (15px, the image-tile radius); ring stroke 3px; ring pitch space-2 (16)
      -->
      <rect class="orange tile" x="20" y="-16" width="140" height="136" rx="15"/>
      <rect class="gold tile" x="20" y="140" width="140" height="164" rx="15"/>
      <rect class="amber tile" x="180" y="-16" width="140" height="232" rx="15"/>
      <rect class="yellow tile" x="180" y="236" width="140" height="68" rx="15"/>
      <rect class="rust tile" x="340" y="100" width="160" height="204" rx="15"/>
      <circle class="ring" cx="250" cy="100" r="50"/>
      <circle class="ring" cx="250" cy="100" r="34"/>
      <circle class="ring" cx="250" cy="100" r="18"/>
      <circle class="iris" cx="250" cy="100" r="6"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Seelig<br>Designs</h1>
    <p class="tag">Wäre es einfach, wäre es langweilig.</p>
  </div>
</div>
</body>
</html>
