<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>RoundButton — preview</title>
<style>
  html, body { margin: 0; }
  body { padding: 24px; background: var(--surface); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .cap { font-size: 12.8px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-caption); margin: 0 0 var(--space-1); }
</style>
</head>
<body class="sd">
<div class="row">
  <button class="slider-btn" aria-label="Vorheriges Testimonial">&larr;</button>
  <button class="slider-btn is-hover" aria-label="Nächstes Testimonial">&rarr;</button>
  <span style="width:var(--space-4)"></span>
  <button class="lb-btn lb-close" aria-label="Schließen">&times;</button>
  <button class="lb-btn lb-next is-hover" style="position:static;transform:none" aria-label="Weiter">&rsaquo;</button>
</div>
</body>
</html>
